name: Backend CI

# Runs on every push AND every pull request targeting main — this is
# the "real deploy comes later" skeleton Master Prompt Section 5 (Phase 3)
# referred to. It only builds+tests for now; actual deployment (Phase 14)
# is a separate, later addition to this same file.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # This is a monorepo — backend/, consumer_flutter/, and partner_portal/
    # all live under one repo root. Every `run:` step in this job defaults
    # to the backend/ subfolder, since that's where pom.xml and mvnw
    # actually live (NOT the repo root — that was the bug: mvnw was being
    # invoked from the repo root where it doesn't exist).
    defaults:
      run:
        working-directory: backend

    # A disposable Postgres, spun up ONLY for this CI run, so tests that
    # hit a real database don't need YOUR local nearnow_db. Same instinct
    # as Testcontainers (Master Prompt Section 5, Part A) — a fresh,
    # throwaway database per run.
    #
    # IMPORTANT: this must be the pgvector image, not plain postgres —
    # schema.sql runs `CREATE EXTENSION IF NOT EXISTS vector` on startup
    # for semantic product search, which a stock Postgres image does not
    # ship with. docker-compose.yml already uses this same image for
    # exactly this reason; CI needs to match it.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nearnow_db_test
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # caches downloaded dependencies between runs — faster CI

      - name: Build and run tests
        env:
          # Must match the "postgres" service above exactly — the default
          # in application.properties points at "nearnow_db", but the
          # service database here is named "nearnow_db_test".
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nearnow_db_test
          DB_PASSWORD: ci_test_password
          JWT_SECRET: ci_test_secret_not_for_real_use_1234567890
          # spring.mail.username/password have NO default in
          # application.properties (correct — a real deployment must
          # supply real ones) — CI needs *some* value so the context can
          # start, even though nothing in this test suite actually sends
          # a real email over SMTP.
          MAIL_USERNAME: ci-test@example.com
          MAIL_APP_PASSWORD: ci_test_app_password
        run: ./mvnw clean verify

  build-and-push-image:
    # Only after build-and-test passes, and only on an actual push to
    # main (not on pull requests — a PR from an untrusted fork shouldn't
    # be able to publish an image under this project's name).
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push to ghcr.io

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # provided automatically by GitHub, no manual secret setup needed

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          # Same monorepo reasoning as above — the Dockerfile lives in
          # backend/, so the build context must point there, not at the
          # repo root (which has no Dockerfile of its own).
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      # STOPS HERE deliberately — actually deploying this image to a
      # running server needs a hosting-platform decision (Render,
      # Railway, Fly.io, etc.) that hasn't been made yet. Adding a
      # deploy step without knowing the real target would mean guessing
      # infrastructure that doesn't exist — a genuine scope-boundary,
      # not an oversight. Add a "deploy" job here once that decision
      # is made.
