name: nearnow_consumer
publish_to: 'none'
description: NearNow consumer Flutter client wired to the Spring Boot REST backend.
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
  speech_to_text: ^7.0.0
  google_mlkit_text_recognition: ^0.13.0
  # Opens Razorpay's own payment sheet (cards, UPI, wallets) and — for
  # UPI specifically — hands off to whichever UPI app the user picks
  # (Google Pay, PhonePe, etc.), then returns success/failure to this
  # app via callback. Test-mode keys mean no real money moves while
  # developing/demoing.
  razorpay_flutter: ^1.3.7

flutter:
  uses-material-design: true
  generate: true
